    <meta charset="UTF-8" />
    <!-- Applies a saved theme override before first paint, so switching to Light/Dark doesn't
         flash the system theme first on the next visit. Keep this in sync with
         `src/ui/themePreference.ts`'s STORAGE_KEY/values — it's duplicated here deliberately since
         it has to run synchronously, before any module script. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('swiftdrive:theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          // Same pre-paint rationale as the theme above: `lang` drives font selection and
          // line-breaking (notably for CJK) plus screen-reader pronunciation, so applying it only
          // once JS boots is visibly late. Pattern-checked rather than trusted verbatim, since
          // this value lands straight in an attribute. Kept in sync with `src/i18n/store.ts`.
          var l = localStorage.getItem('swiftdrive:locale');
          if (l && /^[a-zA-Z]{2,8}(-[a-zA-Z]{2,8})?$/.test(l)) document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
